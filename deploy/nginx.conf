# Reverse proxy for the tournament server.
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/onic.conf
#   sudo sed -i 's/turnamen.example.com/YOUR.DOMAIN/' /etc/nginx/conf.d/onic.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ORACLE LINUX ONLY — do this or every request returns 502:
#   sudo setsebool -P httpd_can_network_connect 1
# SELinux blocks nginx from opening a socket to 127.0.0.1:3000 by default.
#
# Then add HTTPS:  sudo certbot --nginx -d YOUR.DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name turnamen.example.com;

    # Player phones on venue wifi are slow and lossy; give them room.
    client_max_body_size 2m;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
