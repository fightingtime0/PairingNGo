<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standings — Onic TCG</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="screen">

<h1 id="title">…</h1>
<div id="body"></div>

<script src="/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
let view = 'standings';
let latest = null;
let clockNode = null;

/*
 * Views rotate. Once the top cut starts the bracket joins the rotation and the
 * stale final-Swiss pairings drop out of it — otherwise this screen shows the
 * last Swiss round for the whole bracket.
 */
function viewsFor(data) {
  if (data && data.cut) return ['cut', 'standings'];
  return ['standings', 'pairings'];
}

function titleFor(data) {
  if (view === 'cut') return t('tabTopCut');
  return view === 'standings' ? t('standings') : t('pairings');
}

async function refresh() {
  if (!id) {
    $('#title').textContent = 'Add ?id=CODE to the address to show a tournament.';
    return;
  }
  try {
    const data = await api('GET', `/api/tournaments/${id}`);
    latest = data;
    noteServerTime(data.serverNow);
    // If the cut has started and we are still parked on a Swiss-only view, move.
    if (!viewsFor(data).includes(view)) view = viewsFor(data)[0];
    const suffix = view === 'cut' ? '' : ` · ${t('round')} ${data.currentRound}`;
    $('#title').textContent = `${data.name} — ${titleFor(data)}${suffix}`;
    render(data);
  } catch (err) {
    $('#title').textContent = err.message;
  }
}

function render(data) {
  const host = $('#body');
  host.innerHTML = '';
  clockNode = null;

  // Across the room the clock is the second thing anyone looks for, so it sits
  // above whichever face is showing rather than inside one of them.
  if (data.settings.timerEnabled && data.timer) {
    clockNode = el('div', { class: 'clock' });
    paintClock(clockNode, data.timer);
    host.appendChild(el('div', { class: 'clockbar' }, [clockNode]));
  }

  if (view === 'cut' && data.cut) {
    for (const round of data.cut.rounds) {
      const rows = round.matches.map((m) =>
        el('tr', {}, [
          el('td', { class: 'num', text: String(m.table) }),
          el('td', { class: m.result === 'p1' ? 'win' : '', text: m.p1 }),
          el('td', { class: m.result === 'p2' ? 'win' : '', text: m.p2 }),
        ])
      );
      host.appendChild(el('h2', { text: `${t('topCutLabel')} ${data.cut.size} · ${t('cutRound')} ${round.number}` }));
      host.appendChild(el('table', {}, [
        el('thead', {}, [el('tr', {}, [
          el('th', { class: 'num', text: t('table') }),
          el('th', { text: t('player') }),
          el('th', { text: t('opponent') }),
        ])]),
        el('tbody', {}, rows),
      ]));
    }
  } else if (view === 'pairings') {
    const rows = data.pairings.map((m) =>
      el('tr', {}, [
        el('td', { class: 'num', text: m.bye ? '—' : String(m.table) }),
        el('td', { text: m.p1 }),
        el('td', { text: m.bye ? 'bye' : m.p2 }),
      ])
    );
    host.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { class: 'num', text: t('table') }), el('th', { text: t('player') }), el('th', { text: t('opponent') }),
      ])]),
      el('tbody', {}, rows),
    ]));
  } else {
    const rows = data.standings.filter((r) => !r.dropped).map((r) =>
      el('tr', {}, [
        el('td', { class: 'num', text: String(r.rank) }),
        el('td', { text: r.name }),
        el('td', { class: 'num', text: String(r.points) }),
        el('td', { class: 'num', text: recordText(r, data.settings) }),
        el('td', { class: 'num', text: pct(r.opWinPct) }),
      ])
    );
    host.appendChild(el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { class: 'num', text: '#' }),
        el('th', { text: t('player') }),
        el('th', { class: 'num', text: t('points') }),
        el('th', { class: 'num', text: recordHead(data.settings) }),
        el('th', { class: 'num', text: 'Op Win %' }),
      ])]),
      el('tbody', {}, rows),
    ]));
  }
}

// The clock is redrawn locally every second; the data poll below is slower.
setInterval(() => {
  if (clockNode && latest) paintClock(clockNode, latest.timer);
}, 1000);

// Alternate between standings and pairings so one screen covers both.
setInterval(() => {
  const views = viewsFor(latest);
  view = views[(views.indexOf(view) + 1) % views.length];
  refresh();
}, 20000);
setInterval(refresh, 10000);
refresh();
</script>
</body>
</html>
