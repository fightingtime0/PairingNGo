<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onic TCG — Turnamen</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="masthead">
  <div class="brand">Onic TCG <span data-t="brand">Turnamen</span></div>
  <a href="/organizer" data-t="organizer">Panitia</a>
  <button class="theme-toggle" onclick="toggleLang()" data-t="switchLang">English</button>
  <button class="theme-toggle" onclick="toggleTheme()" data-theme-toggle>Dark mode</button>
</header>

<main class="wrap-wide">
  <h1 data-t="allTournaments">Semua turnamen</h1>
  <p class="helper" style="margin-bottom:1.25rem" data-t="listIntro">Pilih turnamen untuk melihat klasemen dan pairing.</p>

  <div class="field" style="max-width:24rem">
    <input id="filter" type="text" data-t-ph="searchTournament" placeholder="Cari turnamen">
  </div>

  <div id="list"></div>
</main>

<script src="/app.js"></script>
<script>
let all = [];

async function load() {
  const host = $('#list');
  try {
    const data = await api('GET', '/api/tournaments');
    all = data.tournaments;
    render();
  } catch (err) {
    host.innerHTML = '';
    host.appendChild(el('div', { class: 'note error', text: err.message }));
  }
}

function render() {
  const host = $('#list');
  host.innerHTML = '';

  const needle = normaliseText($('#filter').value);
  const rows = all.filter((t) => !needle || normaliseText(t.name).includes(needle));

  if (!rows.length) {
    host.appendChild(el('p', { class: 'empty', text: t('noTournaments') }));
    return;
  }

  for (const item of rows) {
    const progress = item.rounds > 0 ? `${item.rounds}/${item.totalRounds} ${t('roundsWord')}` : null;
    host.appendChild(el('a', { class: 'listing', href: `/tournament.html?id=${item.id}` }, [
      el('div', { class: 'listing-main' }, [
        el('div', { class: 'listing-name', text: item.name }),
        el('div', { class: 'listing-meta', text:
          [`${item.players} ${t('playersWord')}`, progress, formatDate(item.createdAt)].filter(Boolean).join(' · ') }),
      ]),
      el('span', { class: 'status ' + item.status, text: t('status_' + item.status) || item.status }),
    ]));
  }
}

function normaliseText(str) {
  return String(str || '').trim().toLowerCase();
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString(LANG === 'id' ? 'id-ID' : 'en-GB',
      { day: 'numeric', month: 'short', year: 'numeric' });
  } catch { return ''; }
}

$('#filter').addEventListener('input', render);
document.documentElement.lang = LANG;
applyStaticText();
load();
setInterval(load, 30000);
</script>
</body>
</html>
